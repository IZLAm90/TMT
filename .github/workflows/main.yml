name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout the code
         uses: action/checkout@v2
       - name: Run Lint
         run: ./gradlew lintDebug
       - name: Upload html test report
         uses: actions/ipload-artifact@v2
         with:
            name: islam.html
            path: app/build/report/lint-results-debug.html
         
       
